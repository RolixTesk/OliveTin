map $http_upgrade $olivetin_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name olivetin.rolixtesk.top;
    ssl_certificate /etc/letsencrypt/live/olivetin.rolixtesk.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olivetin.rolixtesk.top/privkey.pem;
    if ($server_addr != 10.66.0.1) { return 403; }
    allow 10.66.0.1;
    allow 10.66.0.2;
    allow 10.66.0.3;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $olivetin_connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
